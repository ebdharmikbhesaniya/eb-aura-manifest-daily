# Local PostHog for Aura — monolith + datastores (2026-08-10).
#
# Only PostHog runs locally; the app keeps using its normal Supabase/RevenueCat/
# backend. Built from PostHog's own choices: the `posthog/posthog` monolith image
# (web/worker/plugins), Redpanda as the Kafka broker, and ClickHouse with
# SKIP_USER_SETUP. Serves the UI + event ingestion + feature flags on :8000.
#
#   ./up.sh      → http://localhost:8000  (first boot runs migrations, 2–5 min)
#   ./down.sh    (add --volumes to wipe)

name: aura-posthog

x-posthog: &posthog
  image: posthog/posthog:latest
  restart: on-failure
  environment: &posthog-env
    DEBUG: '0'
    DISABLE_SECURE_SSL_REDIRECT: '1'
    IS_BEHIND_PROXY: 'false'
    SECRET_KEY: 'aura_local_dev_secret_change_me_0123456789abcdef'
    SITE_URL: 'http://localhost:8000'
    DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
    REDIS_URL: 'redis://redis:6379/'
    CLICKHOUSE_HOST: 'clickhouse'
    CLICKHOUSE_DATABASE: 'posthog'
    CLICKHOUSE_SECURE: 'false'
    CLICKHOUSE_VERIFY: 'false'
    KAFKA_HOSTS: 'kafka:9092'
    KAFKA_URL: 'kafka://kafka:9092'
    OBJECT_STORAGE_ENABLED: 'true'
    OBJECT_STORAGE_ENDPOINT: 'http://objectstorage:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    clickhouse: { condition: service_healthy }
    kafka: { condition: service_healthy }
    objectstorage: { condition: service_started }

services:
  db:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_DB: posthog
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U posthog']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: on-failure
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: on-failure
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      KAFKA_HOSTS: 'kafka:9092'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [chdata:/var/lib/clickhouse]
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 10s
      retries: 30

  kafka:
    image: redpandadata/redpanda:v24.2.7
    restart: on-failure
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
      - --rpc-addr=kafka:33145
      - --advertise-rpc-addr=kafka:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --set=redpanda.auto_create_topics_enabled=true
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 30

  objectstorage:
    image: minio/minio:latest
    restart: on-failure
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    volumes: [miniodata:/data]

  web:
    <<: *posthog
    command: ./bin/docker-server
    ports: ['8000:8000']

  worker:
    <<: *posthog
    command: ./bin/docker-worker-celery --with-scheduler

  plugins:
    <<: *posthog
    command: ./bin/plugin-server --no-restart-loop

volumes:
  pgdata:
  chdata:
  redpanda:
  miniodata:
